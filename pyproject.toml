[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvtracker-mcp"
version = "0.4.0"
description = "MCP server for HVTracker trust checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "YugantM" }
]
keywords = ["mcp", "model-context-protocol", "ai-agents", "trust", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "mcp>=2.2,<3",
  "requests>=2.32.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=9.0.0",
  "ruff>=0.15.0",
  "twine>=6.0.0"
]

[project.scripts]
hvtracker-mcp = "hvtracker_mcp.server:main"

[project.urls]
Homepage = "https://hvtracker.net"
Repository = "https://github.com/YugantM/hvtracker-mcp"
Issues = "https://github.com/YugantM/hvtracker-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff's pre-0.16 defaults, spelled out: 0.16 widened the default rule set
# (bandit, blind-except, import sorting) and broke CI with no code change.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
