name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # npm Trusted Publishing (OIDC): npmjs.com trusts this workflow file, so
      # there is no NPM_TOKEN to expire (the June token lapsed after 90 days and
      # v0.4.0's npm publish failed with E404). Needs npm >= 11.5.1; Node 22
      # ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
